name: ingestion-service

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ingestion}
      POSTGRES_USER: ${POSTGRES_USER:-ingestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingestion}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBIT_PORT:-5672}:5672"
      - "127.0.0.1:${RABBIT_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-ingestion}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-ingestion}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ingestion}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-ingestion}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-ingestion}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-ingestion}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      STORAGE_RAW_BUCKET: ${STORAGE_RAW_BUCKET:-mediamesh-raw}
      STORAGE_PROCESSED_BUCKET: ${STORAGE_PROCESSED_BUCKET:-mediamesh-processed}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket \"$${STORAGE_RAW_BUCKET}\" || true;
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket \"$${STORAGE_PROCESSED_BUCKET}\" || true;
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket \"$${STORAGE_RAW_BUCKET}\" --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\",\"x-amz-checksum-crc32c\"],\"MaxAgeSeconds\":3600}]}' || true
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8084"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ingestion}
      DB_USER: ${POSTGRES_USER:-ingestion}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ingestion}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: ${RABBIT_USER:-ingestion}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-ingestion}
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:${RUSTFS_PORT:-9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ingestion}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-ingestion}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      STORAGE_RAW_BUCKET: ${STORAGE_RAW_BUCKET:-mediamesh-raw}
      STORAGE_PROCESSED_BUCKET: ${STORAGE_PROCESSED_BUCKET:-mediamesh-processed}
      STORAGE_PATH_STYLE: "true"
    ports:
      - "${API_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  rustfs-data:
