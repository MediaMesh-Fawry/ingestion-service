server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ingestion-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ingestion}
    username: ${DB_USER:ingestion}
    password: ${DB_PASSWORD:ingestion}
  jpa:
    open-in-view: false # disables Open Session in View (OSIV) in Spring Boot.
    hibernate:
      ddl-auto: validate # Hibernate validates schema without creating or modifying it
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true # Checks applied migration checksums
    baseline-on-migrate: true # allows Flyway to initialize version control on an existing database without wiping data.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

storage:
  s3:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:ingestion}
    secret-key: ${STORAGE_SECRET_KEY:ingestion}
    bucket: ${STORAGE_BUCKET:media-ingestion}
    path-style-access: ${STORAGE_PATH_STYLE:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
          additional-path: server:/health/live
        readiness:
          include: readinessState, db, redis
          additional-path: server:/health/ready

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
